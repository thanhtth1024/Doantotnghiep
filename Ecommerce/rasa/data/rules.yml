version: "3.1"

rules:
- rule: Say hello
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say thanks
  steps:
  - intent: thanks
  - action: utter_thanks

- rule: Answer product questions
  steps:
  - intent: ask_products
  - action: action_personalized_help

- rule: Answer price questions
  steps:
  - intent: ask_price
  - action: action_personalized_help

- rule: Answer shipping questions
  steps:
  - intent: ask_shipping
  - action: utter_ask_shipping

- rule: Answer order questions
  steps:
  - intent: ask_order
  - action: action_personalized_help

- rule: Answer payment questions
  steps:
  - intent: ask_payment
  - action: utter_ask_payment

- rule: Answer unknown questions
  steps:
  - intent: fallback
  - action: utter_fallback
